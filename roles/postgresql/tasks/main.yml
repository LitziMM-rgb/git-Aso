---
- name: Instalar PostgreSQL y la librería de Python
  ansible.builtin.zypper:
    name: "{{ postgresql_packages }}"
    state: present

- name: Crear el directorio de datos de PostgreSQL
  ansible.builtin.file:
    path: "{{ pg_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Inicializar el cluster de PostgreSQL
  ansible.builtin.command:
    argv:
      - initdb
      - "--pgdata={{ pg_data_dir }}"
      - --auth-local=peer
      - --auth-host=scram-sha-256
    creates: "{{ pg_data_dir }}/PG_VERSION"
  become_user: postgres

- name: Generar certificado SSL autofirmado
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -x509
      - -days
      - "365"
      - -nodes
      - -text
      - -out
      - "{{ pg_data_dir }}/server.crt"
      - -keyout
      - "{{ pg_data_dir }}/server.key"
      - -subj
      - "/CN={{ ansible_fqdn | default(inventory_hostname) }}"
    creates: "{{ pg_data_dir }}/server.crt"
  become_user: postgres

- name: Proteger los archivos del certificado
  ansible.builtin.file:
    path: "{{ pg_data_dir }}/{{ item.name }}"
    owner: postgres
    group: postgres
    mode: "{{ item.mode }}"
  loop:
    - { name: server.crt, mode: '0644' }
    - { name: server.key, mode: '0600' }

- name: Configurar conexiones remotas y SSL de PostgreSQL
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.conf"
    regexp: '^\s*#?\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
    owner: postgres
    group: postgres
    mode: '0600'
  loop:
    - { key: listen_addresses, value: "'*'" }
    - { key: unix_socket_directories, value: "'{{ pg_data_dir }}'" }
    - { key: ssl, value: "on" }
    - { key: ssl_cert_file, value: "'server.crt'" }
    - { key: ssl_key_file, value: "'server.key'" }
  notify: Reiniciar postgresql

- name: Copiar pg_hba.conf (acceso remoto solo con SSL)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0600'
  notify: Reiniciar postgresql

- name: Habilitar y arrancar el servicio PostgreSQL
  ansible.builtin.systemd:
    name: "{{ postgresql_service }}"
    enabled: yes
    state: started

- name: Aplicar los cambios de configuración ahora
  ansible.builtin.meta: flush_handlers

- name: Poner contraseña al usuario postgres
  community.postgresql.postgresql_user:
    name: postgres
    password: "{{ vault_pg_postgres_password }}"
    login_user: postgres
    login_unix_socket: "{{ pg_data_dir }}"
  become_user: postgres
  no_log: true

- name: Crear el usuario de la base de datos
  community.postgresql.postgresql_user:
    name: "{{ pg_db_user }}"
    password: "{{ vault_pg_db_password }}"
    login_user: postgres
    login_unix_socket: "{{ pg_data_dir }}"
  become_user: postgres
  no_log: true

- name: Crear la base de datos
  community.postgresql.postgresql_db:
    name: "{{ pg_db_name }}"
    owner: "{{ pg_db_user }}"
    login_user: postgres
    login_unix_socket: "{{ pg_data_dir }}"
  become_user: postgres

- name: Abrir PostgreSQL en el firewall
  ansible.posix.firewalld:
    service: postgresql
    permanent: yes
    immediate: yes
    state: enabled
